name: "Setup Environment"
description: "Set up the appropriate build environment common across jobs"

inputs:
  java-version:
    description: "Java runtime version to build with"
    required: false
    default: "25"

runs:
  using: "composite"
  steps:
  - name: "gradle / validate wrapper"
    uses: "gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c" # v6.4.1
  - name: "java ${{ inputs.java-version }}"
    uses: "actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880" # v6.3.0
    with:
      distribution: "zulu"
      java-version: "${{ inputs.java-version }}"
  - name: "gradle / initialize"
    uses: "gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c" # v6.4.1
    with:
      cache-read-only: "${{ github.ref != 'refs/heads/trunk' || github.event_name == 'pull_request' }}"
